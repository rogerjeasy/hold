packages:
  - apps/*
  - packages/*
  - infra
  - eval
allowBuilds:
  # Each ships prebuilt binaries as optional packages, so their install scripts are not needed.
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
minimumReleaseAgeExclude:
  - '@aws-sdk/client-rds-data@3.1151.0'
  - '@aws-sdk/client-secrets-manager@3.1151.0'
  - '@aws-sdk/client-cognito-identity-provider@3.1151.0'
