# Lint, type-check, every unit test and the key end-to-end flows, on every pull request and every push to main. Deploy (deploy.yml) runs only
# after this passes on main. It needs no AWS access and no secret: the tests run against in-process fakes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Type-aware linting reads every package at once and passes Node's default heap of about 2 GB on the runner.
      - run: pnpm check
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @hold/web exec playwright install --with-deps chromium
      # The flows that sign people in, move money or guard access. The full suite, with every page at every width,
      # runs locally with pnpm test:e2e (AGENTS.md section 2).
      - run: pnpm test:e2e:key
        # Without the key AG Grid writes its licence notice to the console, which fails every test of a grid.
        env:
          HOLD_AG_GRID_LICENCE_KEY: ${{ secrets.AG_GRID_LICENCE_KEY }}
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image, without pushing it
        run: docker build --tag hold-app:check .
